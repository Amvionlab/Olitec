<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 210" fill="none" class="w-full h-full">
  <defs>
    <filter id="inv1-shadow" x="-20%" y="-10%" width="140%" height="140%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="14" stdDeviation="10" flood-color="#000000" flood-opacity="0.14" />
      <feDropShadow dx="0" dy="4" stdDeviation="3" flood-color="#000000" flood-opacity="0.08" />
    </filter>
  </defs>

  <!-- Inverter Body -->
  <rect x="22" y="16" width="116" height="178" rx="18" fill="#F8FAFC" filter="url(#inv1-shadow)" />

  <!-- Brand Text -->
  <text x="80" y="38" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="8.5" font-weight="800" fill="#E8962C" letter-spacing="0.08em">OLITEC</text>

  <!-- Dark Screen -->
  <rect x="34" y="46" width="92" height="104" rx="12" fill="#161E2C" />

  <!-- Amber Halo Ring in Center of Screen -->
  <circle cx="80" cy="98" r="20" stroke="#E8962C" stroke-width="4" fill="none" />

  <!-- Bottom 4 Port / Status Dots -->
  <circle cx="53" cy="170" r="4" fill="#64748B" />
  <circle cx="71" cy="170" r="4" fill="#64748B" />
  <circle cx="89" cy="170" r="4" fill="#64748B" />
  <circle cx="107" cy="170" r="4" fill="#64748B" />
</svg>
